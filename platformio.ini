; PlatformIO is used only for host-side unit tests of the hardware-free code in
; core/. The Servo 2040 firmware builds with CMake (firmware/servo2040).
; Run the tests with `mise run test`.

[platformio]
default_envs = native
src_dir = core

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -std=gnu++17 -Wall -Icore
build_src_filter =
    -<*>
    +<movement/kinematics.cpp>
    +<movement/gait.cpp>
    +<movement/body.cpp>
    +<protection/protection.cpp>
    +<protection/resume_gate.cpp>
    +<protection/supervisor.cpp>
