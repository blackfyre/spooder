[tools]
python = "3.13"
# pyyaml: the pioarduino ESP32 platform (bridge firmware) imports it from
# PlatformIO's own environment.
"pipx:platformio" = { version = "6.2.0", uvx_args = "--with pyyaml==6.0.3" }
cmake = "3.31.12"
ninja = "1.13.2"
# The vfox plugin publishes per-architecture builds; this pin is for x86-64 Linux.
gcc-arm-none-eabi = "13.3.Rel1~amd64"
# The desktop calibrator (desktop/, a Go module with a Gio UI).
go = "1.27.1"

[env]
PICO_SDK_PATH = "{{config_root}}/external/pico-sdk"
PIMORONI_PICO_PATH = "{{config_root}}/external/pimoroni-pico"
PICO_BOARD = "pimoroni_servo2040"

[tasks.setup]
description = "Fetch the pinned SDKs (only the sub-submodules the firmware needs)"
run = [
  "git submodule update --init external/pico-sdk external/pimoroni-pico",
  "git -C external/pico-sdk submodule update --init lib/tinyusb",
  "git submodule update --init external/bluepad32-template external/LovyanGFX",
  "git -C external/bluepad32-template submodule update --init --depth 1",
]

[tasks.build]
description = "Build the Servo 2040 firmware (.uf2 in build/servo2040)"
usage = 'flag "--serial" help="Take commands from the USB serial keys instead of the bridge link"'
run = [
  'cmake -S firmware/servo2040 -B build/servo2040 -G Ninja -DCMAKE_BUILD_TYPE=Release -DSPOODER_POWER_LIMITS=${SPOODER_POWER_LIMITS:-$PWD/firmware/servo2040/src/power_limits.h} -DSPOODER_SERVO_PROFILE=${SPOODER_SERVO_PROFILE:-MG996R} -DSPOODER_SERIAL_COMMANDS=$([ "${usage_serial:-false}" = true ] && echo ON || echo OFF)',
  "cmake --build build/servo2040",
]

[tasks.upload]
description = "Build, then copy the firmware to a Servo 2040 in BOOTSEL mode (mounted RPI-RP2 drive)"
usage = 'flag "--serial" help="Take commands from the USB serial keys instead of the bridge link"'
run = '''
if [ "${usage_serial:-false}" = true ]; then mise run build --serial; else mise run build; fi || exit 1
drive=$(findmnt -rn -S LABEL=RPI-RP2 -o TARGET | head -n1)
if [ -z "$drive" ]; then
  echo "No RPI-RP2 drive mounted: hold BOOT, tap RESET, and mount the drive." >&2
  exit 1
fi
cp build/servo2040/spooder.uf2 "$drive"/ && sync
'''

# The readable console (desktop/cmd/spooder-monitor): the robot's text with
# timestamps, link frames kept out of it. It only observes; --keys forwards
# typed keys for a --serial build. No Gio, and no cgo except on macOS.
[tasks.monitor]
description = "Open the Servo 2040 USB console: timestamped text, frames decoded with --frames (observe only)"
usage = '''
flag "--frames" help="Also print a one-line decode of each link frame"
flag "--telemetry-every <n>" help="With --frames, print every Nth telemetry frame (and any that changes)"
flag "--keys" help="Forward typed keys to the robot (the --serial build's keyboard commands)"
flag "--port <path>" help="Use this port or pseudo-terminal instead of the first Servo 2040"
'''
raw = true
run = '''
cgo=0; [ "$(uname)" = Darwin ] && cgo=1
CGO_ENABLED=$cgo go build -C desktop -trimpath -o ../build/desktop/spooder-monitor ./cmd/spooder-monitor || exit 1
set --
[ "${usage_frames:-false}" = true ] && set -- "$@" --frames
[ "${usage_keys:-false}" = true ] && set -- "$@" --keys
[ -n "${usage_telemetry_every:-}" ] && set -- "$@" --telemetry-every "$usage_telemetry_every"
[ -n "${usage_port:-}" ] && set -- "$@" --port "$usage_port"
exec build/desktop/spooder-monitor "$@"
'''

[tasks.monitor-raw]
description = "Open the Servo 2040 USB serial console raw (pio device monitor; frames show as junk)"
run = "pio device monitor -b 115200"

# Bridge firmware (TTGO T-Display). The pioarduino platform runs on its own
# PlatformIO core (pioarduino 6.1.18, installed into .pio-core/penv): mise's
# PlatformIO only bootstraps it, since the two cores pin different SCons
# versions. The project-local core directory keeps the ESP-IDF Python
# environment on mise's Python and away from any global PlatformIO install.
[tasks.build-bridge]
description = "Build the gamepad bridge firmware (TTGO T-Display)"
env = { PLATFORMIO_CORE_DIR = "{{config_root}}/.pio-core" }
run = [
  "[ -x .pio-core/penv/bin/pio ] || pio pkg install -d firmware/bridge",
  ".pio-core/penv/bin/pio run -d firmware/bridge",
]

[tasks.upload-bridge]
description = "Flash the bridge over USB (BRIDGE_PORT, default /dev/ttyUSB0)"
env = { PLATFORMIO_CORE_DIR = "{{config_root}}/.pio-core" }
run = [
  "[ -x .pio-core/penv/bin/pio ] || pio pkg install -d firmware/bridge",
  ".pio-core/penv/bin/pio run -d firmware/bridge -t upload --upload-port ${BRIDGE_PORT:-/dev/ttyUSB0}",
]

[tasks.monitor-bridge]
description = "Open the bridge's Bluepad32 console (BRIDGE_PORT, default /dev/ttyUSB0)"
env = { PLATFORMIO_CORE_DIR = "{{config_root}}/.pio-core" }
run = ".pio-core/penv/bin/pio device monitor -d firmware/bridge -p ${BRIDGE_PORT:-/dev/ttyUSB0} -b 115200"

[tasks.clean]
description = "Remove build artefacts"
run = "rm -rf build .pio/build firmware/bridge/.pio/build"

[tasks.test]
description = "Run host-side unit tests"
run = ["pio test -e native", "mise run test-bridge-build"]

[tasks.test-bridge-build]
description = "Test the bridge build's image-size check (host Python, no ESP-IDF)"
dir = "firmware/bridge/scripts"
run = "python -m unittest -v test_image_size"

# The virtual robot (tools/virtual-robot): the robot's control tick on the
# host, speaking the link protocol over pseudo-terminals.
[tasks.virtual-robot]
description = "Build the virtual robot (build/virtual-robot/virtual-robot)"
run = [
  'cmake -S tools/virtual-robot -B build/virtual-robot -G Ninja -DCMAKE_BUILD_TYPE=Release -DSPOODER_POWER_LIMITS=${SPOODER_POWER_LIMITS:-$PWD/firmware/servo2040/src/power_limits.h} -DSPOODER_SERVO_PROFILE=${SPOODER_SERVO_PROFILE:-MG996R}',
  "cmake --build build/virtual-robot",
]

[tasks.virtual-robot-run]
description = "Build and run the virtual robot, its USB port linked at build/virtual-robot/usb"
depends = ["virtual-robot"]
run = "build/virtual-robot/virtual-robot --link build/virtual-robot/usb --echo"

[tasks.e2e]
description = "End-to-end tests: the desktop calibrator's link and session against the virtual robot"
depends = ["virtual-robot"]
dir = "desktop"
env = { CGO_ENABLED = "1" }
run = "go test -count=1 ./e2e"

# Desktop calibrator (desktop/). Gio needs cgo and the Wayland, X11 and EGL
# development packages on Linux; desktop-deps names any that are missing.
[tasks.desktop-deps]
description = "Check the Linux packages the desktop calibrator's Gio build needs"
run = "desktop/scripts/check-deps.sh"

[tasks.desktop-build]
description = "Build the desktop calibrator (build/desktop/spooder-calibrator)"
depends = ["desktop-deps"]
dir = "desktop"
env = { CGO_ENABLED = "1" }
run = "go build -trimpath -o ../build/desktop/spooder-calibrator ./cmd/spooder-calibrator"

[tasks.desktop-run]
description = "Build and start the desktop calibrator"
depends = ["desktop-build"]
run = "build/desktop/spooder-calibrator"

# The virtual robot keeps the terminal (its commands: supply, estop, unplug...);
# the calibrator opens on its port. Closing either one ends both.
[tasks.desktop-sim]
description = "Build and run the virtual robot with the desktop calibrator on its port"
depends = ["virtual-robot", "desktop-build"]
raw = true # the robot reads its commands from this terminal
run = '''
usb=build/virtual-robot/usb
rm -f "$usb"
robot=$$
(
  until [ -e "$usb" ]; do sleep 0.1; done
  build/desktop/spooder-calibrator --port "$usb" &
  calibrator=$!
  while kill -0 "$robot" 2>/dev/null && kill -0 "$calibrator" 2>/dev/null; do sleep 0.2; done
  kill "$calibrator" "$robot" 2>/dev/null
) &
exec build/virtual-robot/virtual-robot --link "$usb" --echo
'''

[tasks.desktop-install]
description = "Install the calibrator's launcher and icon for this user (Linux, ~/.local/share)"
depends = ["desktop-build"]
run = "desktop/scripts/install-desktop-entry.sh"

[tasks.desktop-icons]
description = "Render desktop/assets/icon.svg to the committed PNGs and .ico (needs resvg and ImageMagick)"
run = "desktop/scripts/render-icons.sh"

[tasks.desktop-test]
description = "Run the desktop calibrator's Go tests (vet, then go test)"
depends = ["desktop-deps"]
dir = "desktop"
env = { CGO_ENABLED = "1" }
run = ["test -z \"$(gofmt -l .)\" || { gofmt -l .; exit 1; }", "go vet ./...", "go test ./..."]
