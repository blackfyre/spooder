; Gamepad bridge firmware for the LilyGO TTGO T-Display v1.1 (original ESP32).
; ESP-IDF + Arduino component + Bluepad32, from the pinned template in
; external/bluepad32-template. Build with `mise run build-bridge`.

[platformio]
src_dir = main

[env:ttgo-t-display]
; pioarduino platform pinned by the Bluepad32 template (ESP-IDF 5.5.x).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31-2/platform-espressif32.zip
framework = espidf
board = esp32dev
board_build.flash_size = 4MB
; The platform reads the partition table from here, not from sdkconfig.
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = direct
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt
