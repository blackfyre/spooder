schema: spec-driven

context: |
  Arduino firmware for a hexapod robot on the Arduino Nano RP2040 Connect
  (PlatformIO, raspberrypi platform, mbed-based Arduino core, C++).
  Toolchain via mise; build with `mise run build`. No unit tests yet, so a
  successful build is the automated gate; hardware behaviour is verified on the board.
  Subsystems live in src/<module>/ and expose setupX()/loopX() functions.

